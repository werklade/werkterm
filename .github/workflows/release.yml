# Builds and checks the release packages. This workflow does NOT publish anything:
# no GitHub release, no SSH, no server access. Publishing happens from the publishing machine with
# "npm run publish-pkg" (docs/release.md) using the artifact "werkterm-<version>".
name: Release build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json must agree; on a tag
      # run the tag (without "v") must match too. A manual run takes the version from the files.
      - name: Check versions
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            version=$(node scripts/release-bundle.mjs --print-version --tag "$REF_NAME")
          else
            version=$(node scripts/release-bundle.mjs --print-version)
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Tauri prerequisites for Debian/Ubuntu; libdbus-1-dev and pkg-config for libdbus-sys
      # (pulled in by tao). serialport is built without libudev (default-features = false).
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libdbus-1-dev pkg-config

      # appstreamcli fails on warnings too (exit code 3, same as for errors). The only accepted
      # warning is the missing homepage (no public page yet), so it is lowered to info; any
      # other warning or error fails the job.
      - name: Validate AppStream metadata
        run: |
          set -euo pipefail
          if ! command -v appstreamcli >/dev/null; then
            sudo apt-get install -y --no-install-recommends appstream
          fi
          appstreamcli --version
          appstreamcli validate --no-net --explain --override=url-homepage-missing=info \
            src-tauri/linux/de.werklade.werkterm.metainfo.xml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: linux

      - name: Install npm packages
        run: npm ci

      # "npm run build" runs tsc (type check) and vite build; the Rust build needs ../dist.
      - name: Type check and build frontend
        run: npm run build

      - name: Frontend and script tests
        run: npm test

      # check-design is left out: it compares against the private sibling repo ../design,
      # which is not available in CI (no package reference to it by design).

      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  linux:
    name: Linux packages
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # bundleMediaFramework copies everything in /usr/lib/x86_64-linux-gnu/gstreamer-1.0 into the
      # AppImage, so only the plugins WebKitGTK needs are installed (base: appsink; good; gl).
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libdbus-1-dev pkg-config \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-gl

      # Read-only: the signing job never writes caches (the check job saves this one).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: linux
          save-if: false

      - name: Install npm packages
        run: npm ci

      - name: Require signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt. Ohne Schlüssel entstehen keine Updater-Signaturen (.sig)."
            exit 1
          fi

      # Old bundles restored from a cache must not be mistaken for this build.
      - name: Remove old bundles
        run: rm -rf src-tauri/target/release/bundle

      # If linuxdeploy fails while stripping (newer system libraries), set NO_STRIP: true here.
      - name: Build packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # NO_STRIP: true
        run: npm run tauri build

      - name: Check release binary for build paths
        run: npm run check-paths

      - name: Check AppStream metadata in .deb
        run: |
          set -euo pipefail
          deb="src-tauri/target/release/bundle/deb/Werkterm_${VERSION}_amd64.deb"
          entry=usr/share/metainfo/de.werklade.werkterm.metainfo.xml
          # List into a variable first: "grep -q" closing the pipe early would trip pipefail.
          # Tauri writes paths without "./"; strip it anyway in case the format changes.
          listing=$(dpkg-deb -c "$deb")
          if ! awk '{p=$NF; sub(/^\.\//,"",p); print p}' <<<"$listing" | grep -xF "$entry" >/dev/null; then
            echo "::error::$entry fehlt in $deb"
            printf '%s\n' "$listing"
            exit 1
          fi

      - name: Check GStreamer plugins in AppImage
        run: |
          set -euo pipefail
          appimage="$PWD/src-tauri/target/release/bundle/appimage/Werkterm_${VERSION}_amd64.AppImage"
          work=$(mktemp -d)
          (cd "$work" && "$appimage" --appimage-extract >/dev/null)
          for f in usr/lib/gstreamer-1.0/libgstapp.so usr/lib/gstreamer-1.0/libgstopengl.so \
              apprun-hooks/linuxdeploy-plugin-gstreamer.sh; do
            if [ ! -e "$work/squashfs-root/$f" ]; then
              echo "::error::$f fehlt im AppImage"
              exit 1
            fi
          done
          echo "GStreamer-Plugins im AppImage: $(ls "$work/squashfs-root/usr/lib/gstreamer-1.0" | wc -l)"
          echo "gst-plugin-scanner: $(cd "$work/squashfs-root" && find . -name gst-plugin-scanner -print)"
          du -sh "$appimage" "$work/squashfs-root/usr/lib/gstreamer-1.0"
          rm -rf "$work"

      - name: Collect packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=src-tauri/target/release/bundle
          mkdir -p release-out
          failed=0
          collect() { # <subdir> <glob> <expected name>
            local matches=("$bundle/$1"/$2)
            if [ "${#matches[@]}" -ne 1 ] || [ "$(basename "${matches[0]}")" != "$3" ]; then
              echo "::error::Erwartet $1/$3, gefunden: ${matches[*]:-nichts}"
              failed=1
              return 0
            fi
            cp -- "${matches[0]}" release-out/
          }
          collect appimage '*.AppImage' "Werkterm_${VERSION}_amd64.AppImage"
          collect appimage '*.AppImage.sig' "Werkterm_${VERSION}_amd64.AppImage.sig"
          collect deb '*.deb' "Werkterm_${VERSION}_amd64.deb"
          if [ "$failed" -ne 0 ]; then
            find "$bundle" -maxdepth 2 -type f -print
            exit 1
          fi
          ls -l release-out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: release-out/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows packages
    needs: check
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # No rust-cache here: the job holds the signing key and must not write caches, and no
      # other job builds on Windows that could provide one to read.

      - name: Install npm packages
        run: npm ci

      - name: Require signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt. Ohne Schlüssel entstehen keine Updater-Signaturen (.sig)."
            exit 1
          fi

      - name: Remove old bundles
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      - name: Build packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Check release binary for build paths
        run: npm run check-paths

      - name: Collect packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=src-tauri/target/release/bundle
          mkdir -p release-out
          failed=0
          collect() { # <subdir> <glob> <expected name>
            local matches=("$bundle/$1"/$2)
            if [ "${#matches[@]}" -ne 1 ] || [ "$(basename "${matches[0]}")" != "$3" ]; then
              echo "::error::Erwartet $1/$3, gefunden: ${matches[*]:-nichts}"
              failed=1
              return 0
            fi
            cp -- "${matches[0]}" release-out/
          }
          collect nsis '*-setup.exe' "Werkterm_${VERSION}_x64-setup.exe"
          collect nsis '*-setup.exe.sig' "Werkterm_${VERSION}_x64-setup.exe.sig"
          collect msi '*.msi' "Werkterm_${VERSION}_x64_en-US.msi"
          collect msi '*.msi.sig' "Werkterm_${VERSION}_x64_en-US.msi.sig"
          if [ "$failed" -ne 0 ]; then
            find "$bundle" -maxdepth 2 -type f -print
            exit 1
          fi
          ls -l release-out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: release-out/
          if-no-files-found: error
          retention-days: 7

  bundle:
    name: Release bundle
    needs: [check, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # release-bundle.mjs has no dependencies, so no npm ci.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-in

      - name: Build release folder
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          # A tag build must have its own CHANGELOG section; a manual run may fall back to [Unreleased].
          extra=()
          if [ "$REF_TYPE" = "tag" ]; then extra=(--require-changelog-section); fi
          node scripts/release-bundle.mjs --version "$VERSION" --in release-in --out "release-dist/werkterm-$VERSION" "${extra[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: werkterm-${{ needs.check.outputs.version }}
          path: release-dist/werkterm-${{ needs.check.outputs.version }}/
          if-no-files-found: error
          retention-days: 30
