[package]
name = "werkterm"
version = "1.2.0"
description = "Werkterm - SSH/SFTP terminal for Linux"
authors = ["Marc-Andre Kolski <344019908+Elaktyl@users.noreply.github.com>"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "werkterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
serialport = { version = "4.10.1", default-features = false }
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
tokio = { version = "1.54", features = ["sync", "time", "net", "macros", "io-util", "rt"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.5.0"

# v1 selects the native Windows store and the pure-Rust zbus Secret Service store.
# The facade's Apple dependency is target-gated and is not built on our targets.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

# Updater only on desktop. rustls (ring + rustls-platform-verifier) instead of native-tls, so
# Linux needs no libssl at runtime; system-proxy reads the Windows proxy settings. The "zip"
# feature (Tauri v1 .zip/.tar.gz update bundles) is not needed. reqwest and time are the
# versions the plugin pulls in; they are named here only for the client policy (redirects,
# timeouts) and the RFC 3339 date in update_check.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
reqwest = { version = "0.13", default-features = false }
time = { version = "0.3", features = ["formatting"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
